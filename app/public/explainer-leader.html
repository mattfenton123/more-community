<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Inter', -apple-system, sans-serif;
    background: #faf9f5;
    color: #1c1917;
  }

  .board {
    position: relative;
    width: 100%;
    height: 100%;
    background:
      radial-gradient(#d6d3cd 0.9px, transparent 0.9px),
      linear-gradient(180deg, #fdfcf7 0%, #f5f2e8 100%);
    background-size: 16px 16px, 100% 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 8px 20px 9px;
    user-select: none;
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    z-index: 6;
    flex-shrink: 0;
  }

  .step-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #0f766e;
    background: rgba(20, 184, 166, 0.14);
    border: 1.5px solid rgba(13, 148, 136, 0.32);
    border-radius: 999px;
    padding: 3px 10px;
    white-space: nowrap;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .map-btn {
    font-size: 10px;
    font-weight: 700;
    color: #44403c;
    background: rgba(255,255,255,0.82);
    border: 1.5px solid #d6d3d1;
    border-radius: 999px;
    padding: 2px 9px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .map-btn:hover { border-color: #0d9488; color: #0f766e; }
  .map-btn.active {
    color: #0f766e;
    border-color: #0d9488;
    background: rgba(20, 184, 166, 0.16);
  }

  .brand-mark {
    font-family: 'Caveat', cursive;
    font-size: 20px;
    font-weight: 700;
    color: #0f172a;
    line-height: 1;
    padding-right: 4px;
    flex-shrink: 0;
  }
  .brand-mark span { color: #0d9488; }

  .viewport {
    position: relative;
    flex: 1;
    min-height: 0;
    width: 100%;
    overflow: hidden;
  }

  svg.panorama {
    width: 100%;
    height: 100%;
    display: block;
  }

  svg.panorama.is-overview .zone {
    cursor: pointer;
  }

  .zone .draw {
    stroke-dasharray: 500;
    stroke-dashoffset: 500;
  }
  .zone.drawn .draw,
  svg.panorama.is-overview .zone .draw,
  body.is-static .zone.drawn .draw {
    animation: sketchDraw 1.0s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .zone.drawn .d1 { animation-delay: 0.08s; }
  .zone.drawn .d2 { animation-delay: 0.28s; }
  .zone.drawn .d3 { animation-delay: 0.5s; }
  .zone.drawn .d4 { animation-delay: 0.72s; }

  .zone .wash { opacity: 0; }
  .zone.drawn .wash {
    animation: washIn 0.42s ease 0.58s forwards;
  }

  svg.panorama.is-overview .zone .draw,
  body.is-static .zone.drawn .draw {
    animation: none;
    stroke-dashoffset: 0;
  }
  svg.panorama.is-overview .zone .wash,
  body.is-static .zone.drawn .wash {
    animation: none;
    opacity: 1;
  }

  .overview-banner { opacity: 0; transition: opacity 0.35s ease; pointer-events: none; }
  svg.panorama.is-overview .overview-banner { opacity: 1; }

  @keyframes sketchDraw { to { stroke-dashoffset: 0; } }
  @keyframes washIn { to { opacity: 1; } }

  .artist-hand {
    position: absolute;
    width: 72px;
    height: 72px;
    left: 48%;
    top: 20%;
    pointer-events: none;
    z-index: 4;
    opacity: 0;
  }
  .artist-hand.sketching {
    animation: handSketch 1.35s ease-in-out;
  }
  @keyframes handSketch {
    0%   { opacity: 0; transform: translate(58px, 34px) rotate(12deg); }
    15%  { opacity: 1; transform: translate(-24px, -6px) rotate(-6deg); }
    38%  { opacity: 1; transform: translate(12px, 12px) rotate(4deg); }
    62%  { opacity: 1; transform: translate(-10px, -12px) rotate(-8deg); }
    84%  { opacity: 1; transform: translate(24px, 6px) rotate(5deg); }
    100% { opacity: 0; transform: translate(72px, 38px) rotate(16deg); }
  }

  .footer-area { flex-shrink: 0; z-index: 6; }

  .caption-bar {
    font-family: 'Caveat', cursive;
    font-size: clamp(16px, 3.35vw, 20px);
    font-weight: 700;
    color: #0f172a;
    text-align: center;

    color: #0d9488;
    text-decoration: underline;
    text-decoration-color: rgba(20, 184, 166, 0.42);

    cursor: pointer;
    transition: all 0.25s ease;
    padding: 0;
  }
  .dot-btn.active {
    width: 34px;
    background: #0d9488;
  }
</style>

<script>
  const METADATA = [{"label": "1 / 4 \u00b7 Escape Burnout", "caption": "Leave messy group chats &amp; <em>out-of-pocket costs</em>"}, {"label": "2 / 4 \u00b7 AI & Co-Hosts", "caption": "Draft with AI, check in by QR &amp; <em>share the load</em>"}, {"label": "3 / 4 \u00b7 Network Funds You", "caption": "Local sponsors send <em>80% straight</em> to your club"}, {"label": "4 / 4 \u00b7 Town Ecosystem", "caption": "Unlock specialists, chapters &amp; <em>Pro (\u00a35M cover)</em>"}];
  const pano = document.getElementById('pano');
  const zones = Array.from(document.querySelectorAll('.zone'));
  const dots = Array.from(document.querySelectorAll('.dot-btn'));
  const stepLabel = document.getElementById('stepLabel');
  const captionBar = document.getElementById('captionBar');
  const hand = document.getElementById('artistHand');
  const overviewBtn = document.getElementById('overviewBtn');

  let current = 0;
  let isOverview = false;
  let timer = null;
  let camBox = [0, 0, 420, 175];
  let animRaf = null;

  function setBox(box) {
    camBox = box;
    pano.setAttribute('viewBox', `${box[0].toFixed(1)} ${box[1].toFixed(1)} ${box[2].toFixed(1)} ${box[3].toFixed(1)}`);
  }

  function animateTo(target, ms) {
    if (animRaf) cancelAnimationFrame(animRaf);
    if (!ms || ms <= 0) {
      setBox(target);
      return;
    }
    const start = [...camBox];
    const t0 = performance.now();
    function tick(now) {
      const p = Math.min(1, (now - t0) / ms);
      const e = 1 - Math.pow(1 - p, 3);
      setBox([
        start[0] + (target[0] - start[0]) * e,
        start[1] + (target[1] - start[1]) * e,
        start[2] + (target[2] - start[2]) * e,
        start[3] + (target[3] - start[3]) * e,
      ]);
      if (p < 1) animRaf = requestAnimationFrame(tick);
      else animRaf = null;
    }
    animRaf = requestAnimationFrame(tick);
  }

  function triggerHand() {
    hand.classList.remove('sketching');
    void hand.offsetWidth;
    hand.classList.add('sketching');
  }

  function showScene(idx, instant) {
    isOverview = false;
    pano.classList.remove('is-overview');
    overviewBtn.classList.remove('active');
    current = ((idx % METADATA.length) + METADATA.length) % METADATA.length;
    animateTo([current * 420, 0, 420, 175], instant ? 0 : 760);
    zones.forEach((z, i) => {
      if (i <= current) z.classList.add('drawn');
      else z.classList.remove('drawn');
    });
    dots.forEach((d, i) => d.classList.toggle('active', i === current));
    stepLabel.textContent = METADATA[current].label;
    captionBar.innerHTML = METADATA[current].caption;
    if (!instant && !params.has('static')) triggerHand();
  }

  function enterOverview(instant) {
    isOverview = true;
    clearInterval(timer);
    pano.classList.add('is-overview');
    overviewBtn.classList.add('active');
    zones.forEach(z => z.classList.add('drawn'));
    animateTo([0, -240, 1680, 650], instant ? 0 : 650);
    stepLabel.textContent = 'Full Network View';
    captionBar.innerHTML = 'How the <em>more. network</em> sustains &amp; funds your community';
    hand.classList.remove('sketching');
  }

  function toggleOverview() {
    if (!isOverview) enterOverview(false);
    else goScene(0);
  }

  function goScene(idx) {
    showScene(idx, false);
    clearInterval(timer);
    if (!params.has('static')) {
      timer = setInterval(() => showScene(current + 1, false), 4200);
    }
  }

  zones.forEach((z, i) => {
    z.addEventListener('click', () => {
      if (isOverview) goScene(i);
    });
  });

  const params = new URLSearchParams(window.location.search);
  if (params.has('static')) {
    document.body.classList.add('is-static');
  }
  if (params.has('overview')) {
    enterOverview(true);
  } else {
    const startScene = parseInt(params.get('scene') || '0', 10);
    showScene(!isNaN(startScene) ? startScene : 0, params.has('static'));
    if (!params.has('static')) {
      timer = setInterval(() => showScene(current + 1, false), 4200);
    }
  }
</script>
