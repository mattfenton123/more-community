<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>more. - How It Works</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Inter', -apple-system, sans-serif;
    background: #faf9f5;
    color: #1e293b;
  }

  .board {
    position: relative;
    width: 100%;
    height: 100%;
    background:
      radial-gradient(#cbd5e1 0.85px, transparent 0.85px),
      linear-gradient(180deg, #fcfbf7 0%, #f5f3ec 100%);
    background-size: 18px 18px, 100% 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 12px 16px 10px;
    user-select: none;
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 5;
  }

  .step-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #0f766e;
    background: rgba(20, 184, 166, 0.14);
    border: 1.5px solid rgba(13, 148, 136, 0.35);
    border-radius: 999px;
    padding: 3px 10px;
  }

  .brand-mark {
    font-family: 'Caveat', cursive;
    font-size: 20px;
    font-weight: 700;
    color: #0f172a;
  }
  .brand-mark span { color: #0d9488; }

  .stage {
    position: relative;
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .scene {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }

  .scene.active {
    opacity: 1;
    pointer-events: auto;
  }

  .scene svg {
    width: 100%;
    max-width: 440px;
    height: auto;
    max-height: 155px;
  }

  .caption {
    font-family: 'Caveat', cursive;
    font-size: 21px;
    font-weight: 700;
    color: #0f172a;
    text-align: center;
    margin-top: 2px;
    line-height: 1.1;
  }
  .caption em {
    font-style: normal;
    color: #0d9488;
    text-decoration: underline;
    text-decoration-color: rgba(20, 184, 166, 0.45);
    text-underline-offset: 3px;
  }

  /* Pencil draw-on animation */
  .draw {
    stroke-dasharray: 420;
    stroke-dashoffset: 420;
  }
  .scene.active .draw {
    animation: sketchDraw 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .scene.active .d1 { animation-delay: 0.05s; }
  .scene.active .d2 { animation-delay: 0.25s; }
  .scene.active .d3 { animation-delay: 0.45s; }
  .scene.active .d4 { animation-delay: 0.65s; }
  .scene.active .d5 { animation-delay: 0.85s; }

  .pop {
    opacity: 0;
    transform: scale(0.92);
    transform-origin: center;
  }
  .scene.active .pop {
    animation: markerPop 0.45s ease forwards;
  }
  .scene.active .p1 { animation-delay: 0.55s; }
  .scene.active .p2 { animation-delay: 0.85s; }
  .scene.active .p3 { animation-delay: 1.15s; }

  /* Animated pencil nib */
  .pencil-cursor {
    position: absolute;
    right: 16px;
    bottom: 22px;
    width: 28px;
    height: 28px;
    opacity: 0;
    pointer-events: none;
  }
  .scene.active .pencil-cursor {
    animation: pencilWiggle 1.4s ease-in-out;
  }

  @keyframes sketchDraw {
    to { stroke-dashoffset: 0; }
  }
  @keyframes markerPop {
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes pencilWiggle {
    0% { opacity: 0; transform: translate(-60px, -20px) rotate(-18deg); }
    20% { opacity: 1; transform: translate(-35px, -8px) rotate(-8deg); }
    50% { opacity: 1; transform: translate(-15px, -18px) rotate(-16deg); }
    80% { opacity: 1; transform: translate(0px, -4px) rotate(-10deg); }
    100% { opacity: 0; transform: translate(10px, 4px) rotate(-5deg); }
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    z-index: 5;
  }
  .dot-btn {
    border: none;
    height: 7px;
    width: 18px;
    border-radius: 999px;
    background: #cbd5e1;
    cursor: pointer;
    transition: all 0.25s ease;
    padding: 0;
  }
  .dot-btn.active {
    width: 34px;
    background: #0d9488;
  }
</style>
</head>
<body>
<div class="board">
  <div class="top-bar">
    <div class="step-pill" id="stepLabel">1 / 4 · Discover</div>
    <div class="brand-mark">more<span>.</span></div>

  <div class="stage">

          <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.3" />

      </defs>
    </svg>

    <!-- SCENE 1: Find Local Events -->
    <div class="scene active" data-label="1 / 4 · Discover">
      <svg viewBox="0 0 420 155" filter="url(#pencilTex)">

        <path class="draw d1" d="M35 128 L135 128 M42 128 L42 96 Q42 86 52 86 L118 86 Q128 86 128 96 L128 128" fill="none" stroke="#334155" stroke-width="2.6" stroke-linecap="round"/>
        <!-- Sam head & body -->
        <circle class="draw d1" cx="78" cy="54" r="16" fill="#fde6d2" stroke="#1e293b" stroke-width="2.6"/>
        <path class="draw d1" d="M62 50 C64 32, 92 32, 94 50" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
        <circle cx="73" cy="54" r="1.8" fill="#1e293b"/>
        <circle cx="84" cy="54" r="1.8" fill="#1e293b"/>
        <path d="M73 61 Q78 65 84 61" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
        <path class="draw d2" d="M62 72 Q78 68 94 72 L98 106 L58 106 Z" fill="rgba(20,184,166,0.18)" stroke="#0d9488" stroke-width="2.6" stroke-linejoin="round"/>
        <!-- Phone -->

        <!-- Arrow to event cards -->
        <path class="draw d3" d="M136 86 Q165 70 190 78" fill="none" stroke="#0d9488" stroke-width="2.4" stroke-dasharray="5 4" stroke-linecap="round"/>
        <path class="draw d3" d="M184 72 L192 78 L184 84" fill="none" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round"/>

        <g class="pop p1">

          <text x="240" y="44" font-size="11" font-weight="700" fill="#0f172a">Pottery &amp; Coffee Morning</text>
        </g>
        <g class="pop p2">
          <rect x="206" y="64" width="182" height="32" rx="9" fill="#ffffff" stroke="#0d9488" stroke-width="2.4"/>
          <circle cx="224" cy="80" r="8" fill="rgba(245,158,11,0.22)"/>
          <text x="224" y="84" text-anchor="middle" font-size="11">☕</text>
          <text x="240" y="84" font-size="11" font-weight="700" fill="#0f172a">Social Meetup &amp; Chats</text>
        </g>
        <g class="pop p3">
          <rect x="206" y="104" width="182" height="32" rx="9" fill="#ffffff" stroke="#1e293b" stroke-width="2.2"/>
          <circle cx="224" cy="120" r="8" fill="rgba(16,185,129,0.22)"/>
          <text x="224" y="124" text-anchor="middle" font-size="11">🥾</text>
          <text x="240" y="124" font-size="11" font-weight="700" fill="#0f172a">Weekend Park Walk</text>

      <div class="caption">Find local <em>events</em> near you</div>
    </div>

        <path class="draw d2" d="M58 68 Q76 64 94 68 L98 118 L54 118 Z" fill="rgba(20,184,166,0.2)" stroke="#0d9488" stroke-width="2.6" stroke-linejoin="round"/>

          <line x1="202" y1="62" x2="390" y2="62" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4"/>

          <rect x="218" y="74" width="102" height="22" rx="6" fill="rgba(245,158,11,0.2)" stroke="#d97706" stroke-width="1.8"/>
          <text x="269" y="89" text-anchor="middle" font-size="10.5" font-weight="800" fill="#b45309">+1 FREE GUEST</text>

          <rect x="336" y="72" width="38" height="38" rx="5" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
          <rect x="342" y="78" width="10" height="10" fill="#1e293b"/>
          <rect x="358" y="78" width="10" height="10" fill="#1e293b"/>
          <rect x="342" y="94" width="10" height="10" fill="#1e293b"/>
          <rect x="358" y="94" width="6" height="6" fill="#0d9488"/>
        </g>
      </svg>
      <div class="caption">RSVP in 1 tap &amp; bring a <em>+1 friend free</em></div>
    </div>

    <!-- SCENE 3: Share a Lift & Exact Meeting Pin -->
    <div class="scene" data-label="3 / 4 · Share a Lift">
      <svg viewBox="0 0 420 155" filter="url(#pencilTex)">
        <!-- Road line -->
        <path class="draw d1" d="M28 122 L392 122" fill="none" stroke="#334155" stroke-width="2.6" stroke-linecap="round"/>

        <circle class="draw d2" cx="84" cy="114" r="11" fill="#ffffff" stroke="#1e293b" stroke-width="2.8"/>
        <circle class="draw d2" cx="154" cy="114" r="11" fill="#ffffff" stroke="#1e293b" stroke-width="2.8"/>
        <!-- Passengers heads in window -->
        <circle cx="96" cy="86" r="7" fill="#fde6d2" stroke="#1e293b" stroke-width="2"/>
        <circle cx="122" cy="86" r="7" fill="#d9a077" stroke="#1e293b" stroke-width="2"/>
        <!-- Dashed path to pin -->
        <path class="draw d3" d="M196 100 Q255 68 310 92" fill="none" stroke="#0d9488" stroke-width="2.4" stroke-dasharray="6 5" stroke-linecap="round"/>
        <!-- Meeting Pin -->
        <g class="pop p2">
          <path d="M342 40 C328 40, 318 51, 318 65 C318 84, 342 108, 342 108 C342 108, 366 84, 366 65 C366 51, 356 40, 342 40 Z" fill="rgba(245,158,11,0.25)" stroke="#d97706" stroke-width="2.6"/>

          <text x="342" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Exact Meeting Point</text>

      <div class="caption"><em>Share a lift</em> &amp; know right where to meet</div>

    <!-- SCENE 4: Check In & Belong -->

        <!-- Leo Host -->
        <circle class="draw d1" cx="96" cy="48" r="16" fill="#e6b48e" stroke="#1e293b" stroke-width="2.6"/>
        <path class="draw d1" d="M80 44 C82 28, 110 28, 112 44" fill="#475569" stroke="#475569" stroke-width="2"/>

        <rect x="98" y="44" width="10" height="8" rx="2" fill="none" stroke="#1e293b" stroke-width="1.8"/>
        <path d="M90 57 Q96 61 102 57" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
        <path class="draw d2" d="M76 66 Q96 62 116 66 L120 118 L72 118 Z" fill="rgba(16,185,129,0.22)" stroke="#059669" stroke-width="2.6" stroke-linejoin="round"/>
        <rect x="82" y="78" width="28" height="13" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>

        <!-- Sam & Maya smiling together -->

        <path d="M275 50 C277 34, 303 34, 305 50" fill="#1e293b"/>

        <path class="draw d3" d="M272 70 Q290 66 308 70 L312 118 L268 118 Z" fill="rgba(20,184,166,0.2)" stroke="#0d9488" stroke-width="2.5"/>

        <circle class="draw d3" cx="348" cy="54" r="15" fill="#d9a077" stroke="#1e293b" stroke-width="2.5"/>
        <path d="M333 52 C335 34, 361 34, 363 52" fill="#0f172a"/>
        <path d="M343 60 Q348 64 353 60" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

        <!-- Sparkles -->

      </svg>
      <div class="caption">Quick <em>check-in</em> &amp; real-life connection</div>
    </div>

    <!-- Animated sketching pencil icon -->
    <svg class="pencil-cursor" viewBox="0 0 32 32">
      <path d="M4 28 L7 20 L23 4 L28 9 L12 25 Z" fill="#fbbf24" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/>
      <path d="M20 7 L25 12" stroke="#1e293b" stroke-width="2"/>
      <path d="M4 28 L9 26 L6 23 Z" fill="#1e293b"/>
    </svg>
  </div>

  <div class="controls">
    <button class="dot-btn active" onclick="goScene(0)" aria-label="Scene 1"></button>
    <button class="dot-btn" onclick="goScene(1)" aria-label="Scene 2"></button>
    <button class="dot-btn" onclick="goScene(2)" aria-label="Scene 3"></button>
    <button class="dot-btn" onclick="goScene(3)" aria-label="Scene 4"></button>
  </div>
</div>

<script>
  const scenes = Array.from(document.querySelectorAll('.scene'));
  const dots = Array.from(document.querySelectorAll('.dot-btn'));
  const label = document.getElementById('stepLabel');
  let current = 0;
  let timer = null;

  function showScene(idx) {
    current = idx % scenes.length;
    scenes.forEach((s, i) => s.classList.toggle('active', i === current));
    dots.forEach((d, i) => d.classList.toggle('active', i === current));
    label.textContent = scenes[current].getAttribute('data-label') || '';
  }

  function goScene(idx) {
    showScene(idx);
    clearInterval(timer);
    timer = setInterval(() => showScene(current + 1), 4000);
  }

  // Support ?scene=N for previewing a specific frame
  const params = new URLSearchParams(window.location.search);
  const startScene = parseInt(params.get('scene') || '0', 10);
  if (!isNaN(startScene) && startScene >= 0 && startScene < scenes.length) {
    showScene(startScene);
  }

  if (!params.has('static')) {
    timer = setInterval(() => showScene(current + 1), 4000);
  }
</script>
</body>
</html>
