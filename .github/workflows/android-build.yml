name: Android Native CI/CD Build

on:
  push:
    branches:
      - master
      - live-site
    paths:
      - 'app/android/**'
      - 'app/src/**'
      - 'app/public/**'
      - 'app/package.json'
      - 'app/capacitor.config.json'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    name: Build Android APK & AAB

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install Web Dependencies
        working-directory: ./app
        run: npm ci

      - name: Build Web Application
        working-directory: ./app
        run: npm run build

      - name: Make Gradle Wrapper Executable
        working-directory: ./app/android
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: ./app/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release Bundle (AAB)
        working-directory: ./app/android
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: more-community-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Release AAB (Google Play Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: more-community-release-aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
